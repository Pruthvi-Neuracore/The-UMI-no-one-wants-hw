[project]
name = "pg-chopstick"
version = "0.1.0"
description = "PG Chopstick gripper kinematics and retargeting onto OpenArm"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest", "yourdfpy"]

[project.scripts]
pg-chopstick-retarget = "pg_chopstick.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pg_chopstick"]

[tool.setuptools.package-data]
pg_chopstick = ["pg_chopstick_kinematics.json"]
